name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: health_info.settings.test
      - run: uv run pytest -q
      - run: cp .env.example .env
      - run: docker compose -f compose.yaml config > /dev/null
        env:
          HEALTH_INFO_IMAGE: health-info:ci
          APP_UID: 10001
          APP_GID: 10001
          APP_DATA_PATH: /tmp/health-info-data
