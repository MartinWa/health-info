[project]
name = "health-info"
# Local tooling metadata only; published container versions come from Git tags.
version = "0.0.1"
description = "One household's health records: server-rendered UI and versioned JSON API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django==5.2.18",
    "filelock==4.2.10",
    "tzdata==2026.6",
    "waitress==3.0.2",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "health_info.settings.test"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
