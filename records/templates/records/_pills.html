<fieldset class="pills{% if field.errors %} invalid{% endif %}">
  <legend>{{ field.label }}</legend>
  <div class="pill-options">
    {% for value, label in field.field.choices %}{% if value %}
      <label class="pill-option">
        <input type="radio" name="{{ field.html_name }}" value="{{ value }}"{% if field.value|stringformat:"s" == value|stringformat:"s" %} checked{% endif %}>
        <span>{{ label }}</span>
      </label>
    {% endif %}{% endfor %}
  </div>
  {% if field.errors %}<div class="errors" role="alert">{{ field.errors }}</div>{% endif %}
</fieldset>
