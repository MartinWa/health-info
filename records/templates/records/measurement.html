{% extends "records/base.html" %}
{% block content %}
  <div class="page-head">
    <div>
      <span class="card-eyebrow">Blood measurement</span>
      <h1>{{ title }}</h1>
    </div>
  </div>

  <form method="post" action="{% url 'records:quick_measurement' %}" class="record-form" novalidate>
    {% csrf_token %}
    {% include "records/_measurement_form.html" %}
    <div class="actions">
      <button class="button" type="submit">Save reading</button>
      <a class="button quiet" href="{% url 'records:dashboard' %}">Cancel</a>
    </div>
  </form>
{% endblock %}
