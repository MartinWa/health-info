{% extends "records/base.html" %}
{% block content %}
  <h1>{{ title }}</h1>
  <form method="get" class="record-form compact" role="search">
    <div class="field">
      <label for="q">Search records</label>
      <input class="input" id="q" name="q" value="{{ query }}" autocomplete="off">
    </div>
    <div class="actions"><button class="button" type="submit">Search</button></div>
  </form>

  {% if query %}
    {% if results %}
      <ul class="plain">
        {% for row in results %}
          <li class="strip">
            <a href="{{ row.url }}">{{ row.text }}</a>
            <p class="hint">{{ row.kind }}</p>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p class="empty">No record contains that text.</p>
    {% endif %}
  {% endif %}
{% endblock %}
