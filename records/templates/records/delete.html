{% extends "records/base.html" %}
{% block content %}
  <div class="page-head">
    <div>
      <span class="card-eyebrow">Delete</span>
      <h1>{{ title }}</h1>
    </div>
  </div>
  <div class="card">
    <p>This removes the record permanently. There is no undo and no revision history.</p>
    <form method="post" class="actions">
      {% csrf_token %}
      <button class="button danger" type="submit">Delete</button>
      <a class="button quiet" href="javascript:history.back()">Cancel</a>
    </form>
  </div>
{% endblock %}
