{% if page_obj.paginator.num_pages > 1 %}
  <nav class="pager" aria-label="Pagination">
    {% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}{% if pager_query %}&{{ pager_query }}{% endif %}">Newer</a>{% endif %}
    <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}{% if pager_query %}&{{ pager_query }}{% endif %}">Older</a>{% endif %}
  </nav>
{% endif %}
